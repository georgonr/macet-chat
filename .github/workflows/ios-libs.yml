name: iOS core libs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = rychla diagnostika, build = plny build (hodiny)"
        required: true
        default: check
        type: choice
        options:
          - check
          - build

jobs:
  ios-libs:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info o stroji
        run: |
          echo "=== architektura ==="
          uname -m
          echo "=== macOS ==="
          sw_vers
          echo "=== volne miesto ==="
          df -h /

      - name: Instalacia Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.iog.io
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

      - name: Overenie Nix
        run: nix --version

      - name: Ake build joby existuju
        run: |
          echo "=== hydraJobs pre aarch64-darwin ==="
          nix eval --impure --json \
            '.#hydraJobs.aarch64-darwin' \
            --apply builtins.attrNames || echo "NEPODARILO SA - skusam packages"
          echo ""
          echo "=== packages pre aarch64-darwin ==="
          nix eval --impure --json \
            '.#packages.aarch64-darwin' \
            --apply builtins.attrNames || echo "NEPODARILO SA"

      - name: Build knizníc
        if: inputs.mode == 'build'
        run: |
          nix build -L --max-jobs auto \
            '.#hydraJobs.aarch64-darwin."aarch64-darwin-ios:lib:simplex-chat"'
          mkdir -p vystup
          find -L result -name '*.a' -exec cp {} vystup/ \;
          echo "=== najdene subory ==="
          ls -la vystup/
          echo "=== architektury ==="
          for f in vystup/*.a; do echo "$f:"; lipo -info "$f" || true; done

      - name: Nahranie knizníc
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs-arm64
          path: vystup/
          if-no-files-found: error
