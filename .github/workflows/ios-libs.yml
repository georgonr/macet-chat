name: iOS core libs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "device = arm64 pre iPhone, sim = x86_64 pre simulator"
        required: true
        default: sim
        type: choice
        options:
          - device
          - sim

permissions:
  id-token: write
  contents: read

jobs:
  device:
    if: inputs.target == 'device'
    runs-on: macos-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.iog.io https://cache.zw3rk.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            fallback = true
      - name: Build
        run: |
          nix build -L '.#hydraJobs.aarch64-darwin."aarch64-darwin-ios:lib:simplex-chat"'
      - name: Zber LEN pkg zipu
        run: |
          mkdir -p vystup
          find -L result -name 'pkg-ios-*.zip' -exec cp {} vystup/ \;
          ls -la vystup/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-libs-device-arm64
          path: vystup/
          if-no-files-found: error

  sim:
    if: inputs.target == 'sim'
    runs-on: macos-15-intel
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Info o stroji
        run: |
          echo "architektura: $(uname -m)"
          sw_vers

      - name: Ako to robi repo
        run: |
          echo "########## prepare-x86_64.sh ##########"
          cat scripts/ios/prepare-x86_64.sh 2>/dev/null || echo "NEEXISTUJE"
          echo ""
          echo "########## prepare.sh ##########"
          cat scripts/ios/prepare.sh 2>/dev/null || echo "NEEXISTUJE"
          echo ""
          echo "########## download-libs.sh ##########"
          cat scripts/ios/download-libs.sh 2>/dev/null || echo "NEEXISTUJE"

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.iog.io https://cache.zw3rk.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            fallback = true

      - name: Zoznam jobov
        run: |
          nix eval --impure --json '.#hydraJobs.x86_64-darwin' \
            --apply builtins.attrNames

      - name: Build x86_64 iOS lib
        run: |
          nix build -L '.#hydraJobs.x86_64-darwin."x86_64-darwin-ios:lib:simplex-chat"'

      - name: Zber LEN pkg zipu
        run: |
          mkdir -p raw
          find -L result -name 'pkg-ios-*.zip' -exec cp {} raw/ \;
          echo "=== stiahnute ==="
          ls -la raw/

      - name: Hladanie mac2ios
        run: |
          echo "=== co ponuka mobile-core-tools ==="
          nix flake show github:zw3rk/mobile-core-tools 2>&1 | head -40 || true

      - name: Patch na simulator
        continue-on-error: true
        run: |
          set -x
          mkdir -p sim rozbalene
          cd rozbalene && unzip -o ../raw/pkg-ios-*.zip && cd ..
          ls -la rozbalene/

          # ziskaj mac2ios cez nix
          nix build github:zw3rk/mobile-core-tools#mac2ios -o mac2ios-out || \
          nix build github:zw3rk/mobile-core-tools -o mac2ios-out || true
          find -L mac2ios-out -type f -perm +111 2>/dev/null | head -20 || true

          MAC2IOS=$(find -L mac2ios-out -name 'mac2ios*' -type f 2>/dev/null | head -1)
          echo "mac2ios: $MAC2IOS"

          if [ -n "$MAC2IOS" ]; then
            for f in rozbalene/*.a; do
              cp "$f" sim/
              chmod u+w "sim/$(basename $f)"
              "$MAC2IOS" -s "sim/$(basename $f)" || echo "zlyhalo: $f"
            done
          else
            echo "mac2ios sa nenasiel - kopirujem nepatchnute"
            cp rozbalene/*.a sim/ || true
          fi

          echo "=== vysledok ==="
          ls -la sim/
          for f in sim/*.a; do
            echo "--- $f"
            ar x "$f" --output /tmp/chk 2>/dev/null || true
            OBJ=$(ls /tmp/chk/*.o 2>/dev/null | head -1)
            [ -n "$OBJ" ] && vtool -show-build "$OBJ" 2>/dev/null | head -8
            rm -rf /tmp/chk; mkdir -p /tmp/chk
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ios-libs-sim-x86_64
          path: |
            raw/
            sim/
          if-no-files-found: warn
