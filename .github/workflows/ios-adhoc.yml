name: iOS ad-hoc build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Info o stroji
        run: |
          echo "architektura: $(uname -m)"
          sw_vers
          xcodebuild -version

      - name: Instalacia Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.iog.io https://cache.zw3rk.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            fallback = true

      - name: Build core kniznic
        run: |
          nix build -L '.#hydraJobs.aarch64-darwin."aarch64-darwin-ios:lib:simplex-chat"'
          mkdir -p raw
          find -L result -name 'pkg-ios-*.zip' -exec cp {} raw/ \;
          ls -la raw/

      - name: Rozbalenie kniznic
        run: |
          mkdir -p apps/ios/Libraries/ios
          cd apps/ios/Libraries/ios
          unzip -o "$GITHUB_WORKSPACE"/raw/pkg-ios-*.zip
          chmod u+w *.a
          echo "=== kniznice ==="
          ls -la

      - name: Import certifikatov a profilov
        env:
          DEV_CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          DEV_P12_PASS: ${{ secrets.P12_PASSWORD }}
          DIST_CERT_B64: ${{ secrets.DIST_CERTIFICATE_BASE64 }}
          DIST_P12_PASS: ${{ secrets.DIST_P12_PASSWORD }}
          DEV_PROFILES_B64: ${{ secrets.PROVISIONING_PROFILES_BASE64 }}
          ADHOC_PROFILES_B64: ${{ secrets.ADHOC_PROFILES_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo -n "$DEV_CERT_B64" | base64 --decode -o "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -P "$DEV_P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"

          echo -n "$DIST_CERT_B64" | base64 --decode -o "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          echo "=== identity (maju byt DVE) ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo -n "$DEV_PROFILES_B64" | base64 --decode -o "$RUNNER_TEMP/dev-profiles.tar.gz"
          tar -xzf "$RUNNER_TEMP/dev-profiles.tar.gz" -C "$PROFILE_DIR"

          echo -n "$ADHOC_PROFILES_B64" | base64 --decode -o "$RUNNER_TEMP/adhoc-profiles.tar.gz"
          tar -xzf "$RUNNER_TEMP/adhoc-profiles.tar.gz" -C "$PROFILE_DIR"

          echo "=== profily (maju byt SEST) ==="
          ls -la "$PROFILE_DIR"

          rm -f "$RUNNER_TEMP/dev.p12" "$RUNNER_TEMP/dist.p12"
          rm -f "$RUNNER_TEMP/dev-profiles.tar.gz" "$RUNNER_TEMP/adhoc-profiles.tar.gz"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/SimpleX.xcodeproj \
            -scheme "SimpleX (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Macet.xcarchive" \
            -allowProvisioningUpdates \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -40

      - name: Export ad-hoc IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>teamID</key>
            <string>MHV67VMY8T</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution: GexPay, SE (MHV67VMY8T)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>eu.macet.chat</key>
              <string>Chat AdHoc App</string>
              <key>eu.macet.chat.NSE</key>
              <string>Chat AdHoc NSE</string>
              <key>eu.macet.chat.SE</key>
              <string>Chat AdHoc SE</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Macet.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -50

          echo "=== vysledok ==="
          ls -la "$RUNNER_TEMP/export/"

      - name: OVERENIE PODPISU
        if: always()
        run: |
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "ZIADNY IPA NEVZNIKOL"
            exit 0
          fi

          WORK="$RUNNER_TEMP/verify"
          mkdir -p "$WORK"
          cp "$IPA" "$WORK/app.zip"
          cd "$WORK"
          unzip -o -q app.zip

          APP=$(ls -d Payload/*.app | head -1)

          echo "############################################"
          echo "### PODPIS HLAVNEJ APPKY"
          echo "############################################"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true

          echo ""
          echo "############################################"
          echo "### PROFIL HLAVNEJ APPKY"
          echo "############################################"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Name raw - || echo "profil sa nenasiel"

          echo ""
          echo "############################################"
          echo "### ROZSIRENIA"
          echo "############################################"
          for ext in "$APP"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            echo "--- $(basename "$ext")"
            codesign -dvv "$ext" 2>&1 | grep -E "^Authority=Apple" | head -1 || true
            security cms -D -i "$ext/embedded.mobileprovision" 2>/dev/null \
              | plutil -extract Name raw - || echo "  profil sa nenasiel"
            echo ""
          done

          echo "############################################"
          echo "### ZARIADENIA V PROFILE"
          echo "############################################"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract ProvisionedDevices xml1 -o - - \
            | grep "<string>" | sed 's/.*<string>//;s/<\/string>.*//' || echo "ziadne"

          echo ""
          echo "############################################"
          echo "### VERDIKT"
          echo "############################################"
          if codesign -dvv "$APP" 2>&1 | grep -q "Authority=Apple Distribution"; then
            echo "OK - podpisane Apple Distribution"
          else
            echo "CHYBA - NIE JE podpisane Apple Distribution"
          fi

      - name: Nahranie IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macet-adhoc-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Nahranie logov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
